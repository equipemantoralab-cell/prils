<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Relatório semanal · Mantora Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2ec;
    --surface: #fffdf9;
    --surface-2: #efe9e0;
    --ink: #1d1a17;
    --ink-2: #57504a;
    --ink-3: #8a8178;
    --line: #e2dad0;
    --accent: #6b3a5b;
    --accent-soft: #f1e4ec;
    --gold: #a87b3e;
    --warn-bg: #fbefd9;
    --warn-ink: #7a5313;
    --shadow: 0 1px 2px rgba(29,26,23,.04), 0 8px 24px -12px rgba(29,26,23,.12);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141215; --surface: #1c1a1e; --surface-2: #242127; --ink: #f2ede6; --ink-2: #bdb5ab;
      --ink-3: #8a8279; --line: #302c33; --accent: #d9a5c6; --accent-soft: #2e2230; --gold: #d5ad6e;
      --warn-bg: #33281a; --warn-ink: #eac88c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141215; --surface: #1c1a1e; --surface-2: #242127; --ink: #f2ede6; --ink-2: #bdb5ab;
    --ink-3: #8a8279; --line: #302c33; --accent: #d9a5c6; --accent-soft: #2e2230; --gold: #d5ad6e;
    --warn-bg: #33281a; --warn-ink: #eac88c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }

  /* Barra superior */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent); color: var(--bg); font: 600 16px/1 var(--serif);
  }
  .brand-name { font: 600 15px/1 var(--sans); letter-spacing: .02em; }
  .brand-name span { color: var(--ink-3); font-weight: 500; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); }
  .theme-btn svg { width: 18px; height: 18px; }

  /* Aviso de demonstração */
  .demo {
    margin-top: 20px; padding: 10px 14px; border-radius: 12px;
    background: var(--warn-bg); color: var(--warn-ink); font-size: 13.5px; line-height: 1.45;
  }
  .demo strong { font-weight: 700; }

  /* Capa */
  .hero { padding: 48px 0 36px; }
  .eyebrow {
    font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  }
  .hero h1 {
    font: 500 clamp(38px, 8vw, 68px)/1.02 var(--serif); letter-spacing: -.02em; margin: 14px 0 0;
  }
  .hero h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: var(--ink-2); font-size: 14.5px; }
  .hero-meta b { color: var(--ink); font-weight: 600; }

  .lead {
    margin: 28px 0 0; padding: 28px; border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .lead-label { font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .lead p { font: 400 clamp(19px, 2.6vw, 24px)/1.45 var(--serif); margin: 12px 0 0; letter-spacing: -.005em; }

  /* Navegação entre áreas */
  .areas-nav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin-top: 28px; scrollbar-width: none; }
  .areas-nav::-webkit-scrollbar { display: none; }
  .areas-nav a {
    flex: none; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px;
  }
  .areas-nav a:hover { color: var(--ink); border-color: var(--ink-3); }

  /* Seções de área */
  .area { padding: 56px 0 8px; border-top: 1px solid var(--line); margin-top: 48px; }
  .area-head { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: baseline; }
  .area-num { font: 400 15px/1 var(--serif); color: var(--gold); font-style: italic; grid-row: span 2; padding-top: 10px; }
  .area h2 { font: 500 clamp(28px, 5vw, 40px)/1.1 var(--serif); letter-spacing: -.015em; margin: 0; }
  .area-sub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink-3); font-size: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2);
  }
  .chip.dia { background: var(--warn-bg); color: var(--warn-ink); }
  .chip svg { width: 13px; height: 13px; }
  .resumo { font-size: 17px; line-height: 1.65; color: var(--ink-2); max-width: 68ch; margin: 20px 0 0; }
  .nota-periodo { font-size: 13.5px; color: var(--warn-ink); margin: 10px 0 0; }

  /* Cartões de destaque */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
  @media (min-width: 860px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 18px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 132px;
  }
  .kpi-valor {
    font: 500 clamp(26px, 6.4vw, 38px)/1.05 var(--serif); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere;
  }
  .kpi-rotulo { margin-top: auto; padding-top: 14px; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); font-weight: 500; }
  .sem-dados { font: 500 15px/1.2 var(--sans); color: var(--ink-3); font-style: normal; letter-spacing: 0; }
  .kpi .sem-dados { font-size: 16px; padding-top: 10px; }
  .delta { margin-top: 8px; font-size: 12.5px; font-weight: 600; }
  .delta[hidden] { display: none; }

  /* Grupos de métricas */
  .grupos { display: grid; gap: 14px; margin-top: 16px; align-items: start; }
  @media (min-width: 720px) { .grupos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; } }
  .grupo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 20px 8px; }
  .grupo h3 {
    font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
    margin: 16px 0 6px;
  }
  .linha { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
  .grupo h3 + .linha { border-top: 0; }
  .linha dt { color: var(--ink-2); font-size: 14.5px; }
  .linha dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .linha dd .sem-dados { font-size: 13.5px; font-weight: 500; }

  /* Próximos passos */
  .passos { padding: 56px 0 8px; border-top: 1px solid var(--line); margin-top: 48px; }
  .passos h2 { font: 500 clamp(28px, 5vw, 40px)/1.1 var(--serif); margin: 0; letter-spacing: -.015em; }
  .passos ol { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; counter-reset: p; }
  .passos li {
    counter-increment: p; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
    font-size: 16px; color: var(--ink-2);
  }
  .passos li::before {
    content: counter(p, decimal-leading-zero); font: italic 400 20px/1.3 var(--serif); color: var(--accent);
  }

  /* Comparação com a semana anterior: preparada, oculta até existir dado */
  .comparacao[hidden] { display: none; }

  footer { margin: 72px 0 0; padding: 28px 0 calc(40px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; }
  footer b { color: var(--ink-2); font-weight: 600; }

  .estado { padding: 80px 0; text-align: center; color: var(--ink-2); }
  .estado code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 14px; }

  @media print {
    .topbar, .areas-nav, .theme-btn { display: none; }
    .area, .passos { break-inside: avoid-page; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#topo" aria-label="Mantora Lab">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Mantora Lab <span>· Relatório semanal</span></span>
    </a>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Alternar modo claro/escuro"></button>
  </div>
</header>

<main id="topo" class="wrap">
  <div class="estado" id="estado">Carregando relatório…</div>
</main>

<footer hidden id="rodape"><div class="wrap"></div></footer>

<script>
(() => {
  "use strict";

  // ---------- Tema ----------
  const raiz = document.documentElement;
  const btnTema = document.getElementById("theme-btn");
  const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const escuroAtivo = () => raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const atualizarIcone = () => { btnTema.innerHTML = escuroAtivo() ? ICONE_SOL : ICONE_LUA; };
  try { const t = localStorage.getItem("mantora-tema"); if (t) raiz.dataset.theme = t; } catch (_) {}
  atualizarIcone();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", atualizarIcone);
  btnTema.addEventListener("click", () => {
    raiz.dataset.theme = escuroAtivo() ? "light" : "dark";
    try { localStorage.setItem("mantora-tema", raiz.dataset.theme); } catch (_) {}
    atualizarIcone();
  });

  // ---------- Formatação (só apresentação; nenhum cálculo sobre os valores) ----------
  const fmtNum = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
  const fmtMoeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const SEM_DADOS = '<span class="sem-dados">sem dados</span>';

  function formatar(valor, formato) {
    if (valor === null || valor === undefined) return SEM_DADOS;
    switch (formato) {
      case "moeda": return esc(fmtMoeda.format(valor));
      case "percentual": return esc(fmtNum.format(valor) + "%");
      case "multiplicador": return esc(fmtNum.format(valor) + "x");
      default: return esc(fmtNum.format(valor));
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function dataLonga(iso) {
    return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // Espaço para comparação com a semana anterior: só aparece se o JSON trouxer "anterior".
  function delta(m) {
    if (m.anterior === null || m.anterior === undefined || m.valor === null) return '<div class="delta" hidden></div>';
    return `<div class="delta">Semana anterior: ${formatar(m.anterior, m.formato)}</div>`;
  }

  const ICONE_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';

  // ---------- Renderização ----------
  function renderArea(area, i) {
    const destaques = area.metricas.filter((m) => m.destaque);
    const grupos = new Map();
    for (const m of area.metricas.filter((m) => !m.destaque)) {
      const g = m.grupo || "Outros indicadores";
      if (!grupos.has(g)) grupos.set(g, []);
      grupos.get(g).push(m);
    }
    const textos = (area.textos || []);
    const ehDia = area.periodo.cobertura === "dia";

    const blocosGrupos = [...grupos].map(([nome, ms]) => `
      <section class="grupo">
        <h3>${esc(nome)}</h3>
        <dl>${ms.map((m) => `<div class="linha"><dt>${esc(m.rotulo)}</dt><dd>${formatar(m.valor, m.formato)}</dd></div>`).join("")}</dl>
      </section>`);

    if (textos.length) {
      blocosGrupos.push(`
      <section class="grupo">
        <h3>Detalhes</h3>
        <dl>${textos.map((t) => `<div class="linha"><dt>${esc(t.rotulo)}</dt><dd>${t.valor === null ? SEM_DADOS : esc(t.valor)}</dd></div>`).join("")}</dl>
      </section>`);
    }

    return `
    <section class="area" id="${esc(area.id)}" aria-labelledby="t-${esc(area.id)}">
      <div class="area-head">
        <span class="area-num">${String(i + 1).padStart(2, "0")}</span>
        <h2 id="t-${esc(area.id)}">${esc(area.titulo)}</h2>
        <div class="area-sub">
          <span class="chip ${ehDia ? "dia" : ""}">${ICONE_CAL}${esc(area.periodo.rotulo)}</span>
          ${area.responsavel ? `<span>com ${esc(area.responsavel)}</span>` : ""}
        </div>
      </div>
      ${area.resumo ? `<p class="resumo">${esc(area.resumo)}</p>` : ""}
      ${ehDia ? `<p class="nota-periodo">Os números desta área referem-se a um único dia e não ao total da semana.</p>` : ""}
      ${destaques.length ? `<div class="kpis">${destaques.map((m) => `
        <article class="kpi">
          <div class="kpi-valor">${formatar(m.valor, m.formato)}</div>
          ${delta(m)}
          <div class="kpi-rotulo">${esc(m.rotulo)}</div>
        </article>`).join("")}</div>` : ""}
      ${blocosGrupos.length ? `<div class="grupos">${blocosGrupos.join("")}</div>` : ""}
    </section>`;
  }

  function render(d) {
    const primeiroNome = d.cliente.nome.split(" ")[0];
    document.title = `${d.cliente.nome} · ${d.periodo.rotulo} · Mantora Lab`;

    const notasDemo = [];
    if (d.demo) notasDemo.push("os números vêm de Reports de teste no ClickUp");
    if (d.textos_exemplo) notasDemo.push("os textos de resumo são exemplos");
    const avisoDemo = notasDemo.length
      ? `<div class="demo" role="note"><strong>Protótipo com dados de demonstração:</strong> ${esc(notasDemo.join(" e "))}.</div>`
      : "";

    const html = `
      ${avisoDemo}
      <section class="hero">
        <div class="eyebrow">Relatório da semana</div>
        <h1>Olá, <em>${esc(primeiroNome)}</em>.<br>Veja como foi a sua semana.</h1>
        <div class="hero-meta">
          <span><b>${esc(d.cliente.nome)}</b></span>
          <span>${esc(d.periodo.rotulo)}</span>
          <span>${d.areas.length} áreas acompanhadas</span>
        </div>
        ${d.destaques ? `<div class="lead"><div class="lead-label">Destaques da semana</div><p>${esc(d.destaques)}</p></div>` : ""}
        <nav class="areas-nav" aria-label="Áreas">
          ${d.areas.map((a) => `<a href="#${esc(a.id)}">${esc(a.titulo)}</a>`).join("")}
          ${d.proximos_passos?.length ? `<a href="#proximos-passos">Próximos passos</a>` : ""}
        </nav>
      </section>

      <section class="comparacao" id="comparacao" ${d.comparacao_anterior ? "" : "hidden"} aria-label="Comparação com a semana anterior"></section>

      ${d.areas.map(renderArea).join("")}

      ${d.proximos_passos?.length ? `
      <section class="passos" id="proximos-passos">
        <div class="eyebrow">O que vem por aí</div>
        <h2 style="margin-top:12px">Próximos passos</h2>
        <ol>${d.proximos_passos.map((p) => `<li><span>${esc(p)}</span></li>`).join("")}</ol>
      </section>` : ""}
    `;
    document.getElementById("topo").innerHTML = html;

    const rodape = document.getElementById("rodape");
    rodape.querySelector(".wrap").innerHTML = `
      <span>Atualizado em <b>${esc(dataLonga(d.fonte.coletado_em))}</b></span>
      <span>Fonte dos dados: Reports semanais das líderes de área no ${esc(d.fonte.sistema)} · Mantora Lab</span>`;
    rodape.hidden = false;
  }

  // ---------- Dados ----------
  // A página depende só do formato do JSON. Hoje: data/<cliente>.json. Depois: Supabase, mesmo formato.
  const slug = (new URLSearchParams(location.search).get("cliente") || "sabrina").replace(/[^a-z0-9-]/gi, "");
  fetch(`data/${slug}.json`, { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(render)
    .catch((err) => {
      const local = location.protocol === "file:";
      document.getElementById("estado").innerHTML = local
        ? `Abra a página por um servidor local para carregar os dados:<br><br><code>python3 -m http.server 8000</code><br><br>e acesse <code>http://localhost:8000</code>.`
        : `Não foi possível carregar o relatório (${esc(err.message)}).`;
    });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Relatório semanal · Mantora Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* Layout: relatório editorial em coluna única; o cliente lê de cima para baixo, do resumo ao detalhe.
     Identidade: --marca-* e --fonte-* vêm do JSON do cliente (bloco "marca"); fundos e neutros derivam da cor primária. */
  :root {
    --marca-claro: #6b3a5b;  --marca-escuro: #d9a5c6;
    --destaque-claro: #a87b3e; --destaque-escuro: #d5ad6e;
    --fonte-titulos: "Fraunces";
    --fonte-texto: "Manrope";

    --brand: var(--marca-claro);
    --gold: var(--destaque-claro);
    --brand-ink: color-mix(in oklab, var(--brand) 82%, #000);
    --brand-soft: color-mix(in oklab, var(--brand) 10%, #fff);
    --bg: color-mix(in oklab, var(--brand) 4%, #f8f6f2);
    --surface: color-mix(in oklab, var(--brand) 1.5%, #fffefc);
    --surface-2: color-mix(in oklab, var(--brand) 6%, #f1eee9);
    --ink: #1b1c1b;
    --ink-2: color-mix(in oklab, var(--brand) 12%, #4f4c48);
    --ink-3: color-mix(in oklab, var(--brand) 10%, #85807a);
    --line: color-mix(in oklab, var(--brand) 9%, #e3dfd8);
    --track: color-mix(in oklab, var(--brand) 8%, #ece9e3);
    --warn-bg: #fbefd9; --warn-ink: #7a5313;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 10px 28px -16px rgba(20,20,20,.16);

    --serif: var(--fonte-titulos), Georgia, "Times New Roman", serif;
    --sans: var(--fonte-texto), system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: var(--marca-escuro); --gold: var(--destaque-escuro);
      --brand-ink: color-mix(in oklab, var(--brand) 78%, #fff);
      --brand-soft: color-mix(in oklab, var(--brand) 16%, #161717);
      --bg: color-mix(in oklab, var(--brand) 5%, #121313); --surface: color-mix(in oklab, var(--brand) 6%, #1a1b1b);
      --surface-2: color-mix(in oklab, var(--brand) 9%, #222323); --ink: #f1efea;
      --ink-2: color-mix(in oklab, var(--brand) 10%, #bcb7b0); --ink-3: color-mix(in oklab, var(--brand) 10%, #87827b);
      --line: color-mix(in oklab, var(--brand) 12%, #2c2d2d); --track: color-mix(in oklab, var(--brand) 12%, #262727);
      --warn-bg: #33281a; --warn-ink: #eac88c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --brand: var(--marca-escuro); --gold: var(--destaque-escuro);
    --brand-ink: color-mix(in oklab, var(--brand) 78%, #fff);
    --brand-soft: color-mix(in oklab, var(--brand) 16%, #161717);
    --bg: color-mix(in oklab, var(--brand) 5%, #121313); --surface: color-mix(in oklab, var(--brand) 6%, #1a1b1b);
    --surface-2: color-mix(in oklab, var(--brand) 9%, #222323); --ink: #f1efea;
    --ink-2: color-mix(in oklab, var(--brand) 10%, #bcb7b0); --ink-3: color-mix(in oklab, var(--brand) 10%, #87827b);
    --line: color-mix(in oklab, var(--brand) 12%, #2c2d2d); --track: color-mix(in oklab, var(--brand) 12%, #262727);
    --warn-bg: #33281a; --warn-ink: #eac88c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
  @media (min-width: 720px) { .wrap { padding-inline: 32px; } }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }
  h1, h2, h3 { text-wrap: balance; }

  /* Barra superior: marca do cliente + assinatura Mantora */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; gap: 12px; }
  .cliente-marca { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
  .monograma {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--brand); color: var(--surface); font: 600 13px/1 var(--sans); letter-spacing: .04em;
  }
  .cliente-logo { height: 32px; width: auto; display: block; }
  .cliente-nome { font: 600 15px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-dir { display: flex; align-items: center; gap: 12px; flex: none; }
  .assinatura { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
  .assinatura b { color: var(--ink-2); font-weight: 600; }
  @media (max-width: 420px) { .assinatura { display: none; } }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); }
  .theme-btn svg { width: 18px; height: 18px; }

  .demo { margin-top: 20px; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13.5px; line-height: 1.45; }

  /* Capa */
  .hero { padding-block: 40px 8px; }
  .eyebrow { font: 600 12px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brand-ink); }
  .hero h1 { font: 500 clamp(36px, 7vw, 60px)/1.04 var(--serif); letter-spacing: -.02em; margin: 12px 0 0; }
  .hero h1 em { font-style: italic; color: var(--brand-ink); font-weight: 400; }
  .hero-sub { margin: 14px 0 0; color: var(--ink-2); font-size: 16px; max-width: 60ch; }

  .lead { margin-top: 28px; padding: 26px 28px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
  .rotulo-secao { font: 600 12px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .lead p { font: 400 clamp(18px, 2.4vw, 22px)/1.5 var(--serif); margin: 10px 0 0; }

  /* Panorama */
  .panorama { margin-top: 20px; padding: 22px 0 6px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
  .panorama .rotulo-secao { padding-inline: 24px; }

  /* Tabelas */
  .tabela-wrap { overflow-x: auto; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { padding: 12px 20px 12px 0; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 24px; }
  .grafico th:first-child, .grafico td:first-child { padding-left: 0; }
  .grafico th:last-child, .grafico td:last-child { padding-right: 0; }
  thead th { border-top: 0; font: 600 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-block: 8px; }
  td { font-variant-numeric: tabular-nums; font-weight: 600; }
  td:first-child { font-weight: 500; color: var(--ink-2); white-space: normal; min-width: 110px; }
  /* Tabelas de várias colunas viram blocos empilhados no celular */
  @media (max-width: 520px) {
    table.resp thead { display: none; }
    table.resp tr { display: block; padding: 12px 0; border-top: 1px solid var(--line); }
    table.resp td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 3px 0 !important; text-align: right; }
    table.resp td::before { content: attr(data-rotulo); color: var(--ink-3); font-weight: 500; text-align: left; }
    table.resp td:first-child { display: block; text-align: left; color: var(--ink); font-weight: 600; padding-bottom: 6px !important; }
    table.resp td:first-child::before { content: none; }
    .panorama table.resp tr { padding-inline: 16px; }
  }
  @media (max-width: 520px) { table { font-size: 13.5px; } th, td { padding-right: 12px; } th:first-child, td:first-child { padding-left: 16px; } .panorama .rotulo-secao { padding-inline: 16px; } .grafico { padding-inline: 16px; } }
  td .nao-se-aplica { color: var(--ink-3); font-weight: 400; }
  td .periodo-cel { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  td .periodo-cel.dia { color: var(--warn-ink); }

  /* Navegação */
  .areas-nav { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin-top: 24px; scrollbar-width: none; }
  .areas-nav::-webkit-scrollbar { display: none; }
  .areas-nav a { flex: none; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; }
  .areas-nav a:hover { color: var(--ink); border-color: var(--ink-3); }

  /* Áreas */
  .area { padding-top: 52px; border-top: 1px solid var(--line); margin-top: 48px; }
  .area-head { display: flex; flex-direction: column; gap: 10px; }
  .area h2 { font: 500 clamp(28px, 5vw, 40px)/1.1 var(--serif); letter-spacing: -.015em; margin: 0; }
  .area-sub { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--ink-3); font-size: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .chip.dia { background: var(--warn-bg); color: var(--warn-ink); }
  .chip svg { width: 13px; height: 13px; }
  .resumo { font-size: 17px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; margin: 18px 0 0; }
  .nota-periodo { font-size: 13.5px; color: var(--warn-ink); margin: 8px 0 0; }

  /* Números principais */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
  @media (min-width: 860px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
  .kpi { container-type: inline-size; }
  .kpi-valor { font: 650 clamp(17px, 12.5cqi, 30px)/1.15 var(--sans); letter-spacing: -.02em; }
  .kpi-rotulo { margin-top: auto; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); font-weight: 500; }
  .sem-dados { font: 500 14px/1.2 var(--sans); color: var(--ink-3); letter-spacing: 0; }
  .delta { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }

  /* Cartões de gráfico */
  .graficos { display: grid; gap: 14px; margin-top: 14px; align-items: start; }
  @media (min-width: 760px) { .graficos { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grafico.largo { grid-column: 1 / -1; } }
  .grafico { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 18px; min-width: 0; }
  .grafico-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .grafico h3 { font: 600 16px/1.3 var(--sans); margin: 0; }
  .grafico .sub { font-size: 13.5px; color: var(--ink-3); margin: 2px 0 0; }
  .btn-tabela { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font: 600 12px/1 var(--sans); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
  .btn-tabela:hover { color: var(--ink); border-color: var(--ink-3); }
  .grafico-corpo { margin-top: 18px; }

  /* Barras horizontais: uma série, cor da marca, ponta arredondada, valor na ponta */
  .barras { display: grid; gap: 14px; }
  .barra-linha { display: grid; gap: 6px; }
  .barra-rotulo { font-size: 13.5px; color: var(--ink-2); }
  .barra-trilho { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 20px; }
  .barra-area { min-width: 0; }
  .barra { height: 18px; border-radius: 0 4px 4px 0; background: var(--brand); min-width: 3px; transition: filter .15s; }
  .barra-linha:hover .barra { filter: brightness(1.1); }
  .barra-valor { font-weight: 650; font-size: 14px; white-space: nowrap; }
  .barra-vazia { height: 18px; grid-column: 1 / -1; border-radius: 4px; border: 1px dashed var(--line); display: flex; align-items: center; padding-left: 10px; }
  .barra-vazia .sem-dados { font-size: 12.5px; }

  /* Funil: barras centradas, largura proporcional ao valor de cada etapa */
  .funil { display: grid; gap: 4px; }
  .funil-etapa { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; padding-block: 6px; }
  .funil-rotulo { font-size: 13.5px; color: var(--ink-2); }
  .funil-valor { font-weight: 650; font-size: 14px; white-space: nowrap; text-align: right; }
  .funil-faixa { grid-column: 1 / -1; display: flex; justify-content: center; background: var(--track); border-radius: 6px; height: 26px; overflow: hidden; }
  .funil-faixa .barra { height: 100%; border-radius: 6px; }
  .funil-faixa.vazia { background: transparent; border: 1px dashed var(--line); }
  .funil-etapa:nth-child(2) .barra { background: color-mix(in oklab, var(--brand) 85%, var(--surface)); }
  .funil-etapa:nth-child(3) .barra { background: color-mix(in oklab, var(--brand) 72%, var(--surface)); }
  .funil-etapa:nth-child(n+4) .barra { background: color-mix(in oklab, var(--brand) 60%, var(--surface)); }

  .escala { margin-top: 12px; font-size: 12px; color: var(--ink-3); }

  /* Tooltip */
  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 7px 10px; border-radius: 8px; box-shadow: var(--shadow); max-width: 240px; }
  .tip b { font-weight: 700; }

  /* Todos os indicadores (detalhe sob demanda) */
  details.detalhe { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  details.detalhe > summary { cursor: pointer; list-style: none; padding: 16px 22px; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  details.detalhe > summary::-webkit-details-marker { display: none; }
  details.detalhe > summary::after { content: "+"; font: 400 22px/1 var(--sans); color: var(--ink-3); }
  details.detalhe[open] > summary::after { content: "–"; }
  details.detalhe > summary span { color: var(--ink-3); font-weight: 500; font-size: 13.5px; }
  .grupos { display: grid; gap: 0 32px; padding: 0 22px 12px; }
  @media (min-width: 720px) { .grupos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .grupo h4 { font: 600 12px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 4px; }
  .linha { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
  .grupo h4 + dl .linha:first-child { border-top: 0; }
  dl { margin: 0; }
  .linha dt { color: var(--ink-2); font-size: 14.5px; }
  .linha dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

  /* Próximos passos */
  .passos { padding-top: 52px; border-top: 1px solid var(--line); margin-top: 48px; }
  .passos h2 { font: 500 clamp(28px, 5vw, 40px)/1.1 var(--serif); margin: 12px 0 0; letter-spacing: -.015em; }
  .passos ul { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; }
  .passos li { display: grid; grid-template-columns: 14px 1fr; gap: 14px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; font-size: 16px; color: var(--ink-2); }
  .passos li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); transform: translateY(-1px); }

  .comparacao[hidden], .evolucao[hidden] { display: none; }

  footer { margin-top: 72px; padding-block: 28px calc(40px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; }
  footer b { color: var(--ink-2); font-weight: 600; }

  .estado { padding-block: 80px; text-align: center; color: var(--ink-2); }
  .estado code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 14px; }

  @media print {
    .topbar, .areas-nav, .theme-btn, .btn-tabela { display: none; }
    .area, .passos, .grafico { break-inside: avoid-page; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="cliente-marca" href="#topo" id="cliente-marca"><span class="monograma" aria-hidden="true"></span><span class="cliente-nome"></span></a>
    <div class="top-dir">
      <span class="assinatura">por <b>Mantora Lab</b></span>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Alternar modo claro/escuro"></button>
    </div>
  </div>
</header>

<main id="topo" class="wrap">
  <div class="estado" id="estado">Carregando relatório…</div>
</main>

<footer hidden id="rodape"><div class="wrap"></div></footer>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
  "use strict";

  // ---------- Tema claro/escuro ----------
  const raiz = document.documentElement;
  const btnTema = document.getElementById("theme-btn");
  const ICONE_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICONE_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  const escuroAtivo = () => raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const atualizarIcone = () => { btnTema.innerHTML = escuroAtivo() ? ICONE_SOL : ICONE_LUA; };
  try { const t = localStorage.getItem("relatorio-tema"); if (t) raiz.dataset.theme = t; } catch (_) {}
  atualizarIcone();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", atualizarIcone);
  btnTema.addEventListener("click", () => {
    raiz.dataset.theme = escuroAtivo() ? "light" : "dark";
    try { localStorage.setItem("relatorio-tema", raiz.dataset.theme); } catch (_) {}
    atualizarIcone();
  });

  // ---------- Identidade visual do cliente ----------
  const COR = /^#[0-9a-f]{3,8}$/i;
  const FONTE = /^[\w\s-]{2,60}$/;
  function aplicarMarca(marca, nome) {
    marca = marca || {};
    const c = marca.cores || {};
    const pares = { "--marca-claro": c.primaria, "--marca-escuro": c.primaria_escuro || c.primaria, "--destaque-claro": c.destaque, "--destaque-escuro": c.destaque_escuro || c.destaque };
    for (const [k, v] of Object.entries(pares)) if (v && COR.test(v)) raiz.style.setProperty(k, v);

    const f = marca.fontes || {};
    const familias = [f.titulos, f.texto].filter((x) => x && FONTE.test(x));
    if (f.titulos && FONTE.test(f.titulos)) raiz.style.setProperty("--fonte-titulos", `"${f.titulos}"`);
    if (f.texto && FONTE.test(f.texto)) raiz.style.setProperty("--fonte-texto", `"${f.texto}"`);
    if (familias.length) {
      const q = [...new Set(familias)].map((n) => "family=" + encodeURIComponent(n).replace(/%20/g, "+") + ":ital,wght@0,400;0,500;0,600;0,700;1,400").join("&");
      const link = document.createElement("link");
      link.rel = "stylesheet"; link.href = `https://fonts.googleapis.com/css2?${q}&display=swap`;
      link.onerror = () => {}; document.head.appendChild(link);
    }

    const alvo = document.getElementById("cliente-marca");
    alvo.querySelector(".cliente-nome").textContent = nome;
    alvo.setAttribute("aria-label", nome);
    if (marca.logo) {
      const img = new Image(); img.className = "cliente-logo"; img.alt = nome; img.src = marca.logo;
      alvo.querySelector(".monograma").replaceWith(img);
    } else {
      const ini = marca.monograma || nome.split(/\s+/).map((p) => p[0]).slice(0, 2).join("");
      alvo.querySelector(".monograma").textContent = ini.toUpperCase();
    }
  }

  // ---------- Formatação (apresentação apenas; nada é calculado sobre os valores) ----------
  const fmtNum = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
  const fmtMoeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const SEM_DADOS = '<span class="sem-dados">sem dados</span>';
  const NAO_SE_APLICA = '<span class="nao-se-aplica" title="Indicador não acompanhado nesta etapa">—</span>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function textoValor(valor, formato) {
    if (valor === null || valor === undefined) return null;
    switch (formato) {
      case "moeda": return fmtMoeda.format(valor);
      case "percentual": return fmtNum.format(valor) + "%";
      case "multiplicador": return fmtNum.format(valor) + "x";
      default: return fmtNum.format(valor);
    }
  }
  const formatar = (v, f) => { const t = textoValor(v, f); return t === null ? SEM_DADOS : esc(t); };
  const celulaHtml = (cel, f) => (cel === null ? NAO_SE_APLICA : formatar(cel.valor, f));
  const dataLonga = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });

  const ICONE_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
  let seq = 0;

  // ---------- Gráficos (genéricos: dependem só do formato do JSON) ----------
  // Largura proporcional ao maior valor do próprio gráfico (escala linear a partir de zero).
  function escalaMax(itens, escala100) {
    const max = Math.max(0, ...itens.map((i) => i.valor ?? 0));
    return escala100 ? Math.max(100, max) : max;
  }
  const pct = (v, max) => (max > 0 ? Math.max(1.5, (v / max) * 100) : 0);

  function tabelaDeItens(g) {
    return `<div class="tabela-wrap"><table><thead><tr><th>Indicador</th><th>Valor</th></tr></thead><tbody>
      ${g.itens.map((i) => `<tr><td>${esc(i.rotulo)}</td><td>${formatar(i.valor, i.formato)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }

  function graficoBarras(g) {
    const max = escalaMax(g.itens, g.escala_100);
    return `<div class="barras">${g.itens.map((i) => {
      const t = textoValor(i.valor, i.formato);
      return `<div class="barra-linha" data-tip="${esc(i.rotulo)}|${esc(t ?? "sem dados")}">
        <div class="barra-rotulo">${esc(i.rotulo)}</div>
        <div class="barra-trilho">${t === null
          ? `<div class="barra-vazia">${SEM_DADOS}</div>`
          : `<div class="barra-area"><div class="barra" style="width:${pct(i.valor, max)}%"></div></div><span class="barra-valor">${esc(t)}</span>`}
        </div></div>`;
    }).join("")}</div>
    ${g.escala_100 ? `<div class="escala">Escala de 0 a ${esc(textoValor(max, "percentual"))}</div>` : ""}`;
  }

  function graficoFunil(g) {
    const max = escalaMax(g.itens);
    return `<div class="funil">${g.itens.map((i) => {
      const t = textoValor(i.valor, i.formato);
      return `<div class="funil-etapa" data-tip="${esc(i.rotulo)}|${esc(t ?? "sem dados")}">
        <span class="funil-rotulo">${esc(i.rotulo)}</span>
        <span class="funil-valor">${t === null ? SEM_DADOS : esc(t)}</span>
        <div class="funil-faixa ${t === null ? "vazia" : ""}">${t === null ? "" : `<div class="barra" style="width:${pct(i.valor, max)}%"></div>`}</div>
      </div>`;
    }).join("")}</div>`;
  }

  function graficoTabela(g) {
    return `<div class="tabela-wrap"><table class="resp">
      <thead><tr><th></th>${g.colunas.map((c) => `<th>${esc(c.rotulo)}</th>`).join("")}</tr></thead>
      <tbody>${g.linhas.map((l) => `<tr><td>${esc(l.rotulo)}</td>${l.celulas.map((cel, k) => `<td data-rotulo="${esc(g.colunas[k].rotulo)}">${celulaHtml(cel, g.colunas[k].formato)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  function renderGrafico(g) {
    const id = `g${++seq}`;
    const corpo = g.tipo === "barras" ? graficoBarras(g) : g.tipo === "funil" ? graficoFunil(g) : g.tipo === "tabela" ? graficoTabela(g) : "";
    if (!corpo) return "";
    const temAlternativa = g.tipo !== "tabela";
    const largo = g.tipo === "tabela" && g.colunas.length > 2;
    return `<figure class="grafico ${largo ? "largo" : ""}" style="margin:0">
      <div class="grafico-head">
        <figcaption><h3>${esc(g.titulo)}</h3>${g.subtitulo ? `<p class="sub">${esc(g.subtitulo)}</p>` : ""}</figcaption>
        ${temAlternativa ? `<button class="btn-tabela" type="button" data-alterna="${id}" aria-expanded="false">Ver tabela</button>` : ""}
      </div>
      <div class="grafico-corpo" id="${id}-g">${corpo}</div>
      ${temAlternativa ? `<div class="grafico-corpo" id="${id}-t" hidden>${tabelaDeItens(g)}</div>` : ""}
    </figure>`;
  }

  // ---------- Seções ----------
  function renderPanorama(p) {
    if (!p || !p.linhas?.length) return "";
    return `<section class="panorama" aria-label="${esc(p.titulo)}">
      <div class="rotulo-secao">${esc(p.titulo)}</div>
      <div class="tabela-wrap"><table class="resp">
        <thead><tr><th>Área</th>${p.colunas.map((c) => `<th>${esc(c.rotulo)}</th>`).join("")}</tr></thead>
        <tbody>${p.linhas.map((l) => `<tr>
          <td><a href="#${esc(l.area)}" style="color:inherit;text-decoration:none">${esc(l.rotulo)}</a><span class="periodo-cel ${l.periodo.cobertura === "dia" ? "dia" : ""}">${esc(l.periodo.rotulo)}</span></td>
          ${l.celulas.map((cel, k) => `<td data-rotulo="${esc(p.colunas[k].rotulo)}">${celulaHtml(cel, p.colunas[k].formato)}</td>`).join("")}
        </tr>`).join("")}</tbody>
      </table></div>
    </section>`;
  }

  function renderArea(area) {
    const destaques = area.metricas.filter((m) => m.destaque);
    const grupos = new Map();
    for (const m of area.metricas.filter((m) => !m.destaque)) {
      const g = m.grupo || "Outros indicadores";
      if (!grupos.has(g)) grupos.set(g, []);
      grupos.get(g).push(m);
    }
    const linhas = (itens) => itens.map((x) => `<div class="linha"><dt>${esc(x.rotulo)}</dt><dd>${x.formato === undefined ? (x.valor === null ? SEM_DADOS : esc(x.valor)) : formatar(x.valor, x.formato)}</dd></div>`).join("");
    const blocos = [...grupos].map(([nome, ms]) => `<div class="grupo"><h4>${esc(nome)}</h4><dl>${linhas(ms)}</dl></div>`);
    if (area.textos?.length) blocos.push(`<div class="grupo"><h4>Detalhes</h4><dl>${linhas(area.textos)}</dl></div>`);
    const totalIndicadores = area.metricas.length + (area.textos?.length || 0);
    const ehDia = area.periodo.cobertura === "dia";

    return `
    <section class="area" id="${esc(area.id)}" aria-labelledby="t-${esc(area.id)}">
      <div class="area-head">
        <h2 id="t-${esc(area.id)}">${esc(area.titulo)}</h2>
        <div class="area-sub">
          <span class="chip ${ehDia ? "dia" : ""}">${ICONE_CAL}${esc(area.periodo.rotulo)}</span>
          ${area.responsavel ? `<span>com ${esc(area.responsavel)}</span>` : ""}
        </div>
      </div>
      ${area.resumo ? `<p class="resumo">${esc(area.resumo)}</p>` : ""}
      ${ehDia ? `<p class="nota-periodo">Os números desta área referem-se a um único dia e não ao total da semana.</p>` : ""}
      ${destaques.length ? `<div class="kpis">${destaques.map((m) => `
        <article class="kpi">
          <div class="kpi-valor">${formatar(m.valor, m.formato)}</div>
          ${m.anterior !== null && m.anterior !== undefined ? `<div class="delta">Semana anterior: ${formatar(m.anterior, m.formato)}</div>` : ""}
          <div class="kpi-rotulo">${esc(m.rotulo)}</div>
        </article>`).join("")}</div>` : ""}
      ${area.graficos?.length ? `<div class="graficos">${area.graficos.map(renderGrafico).join("")}</div>` : ""}
      ${blocos.length ? `<details class="detalhe"><summary>Todos os indicadores <span>${totalIndicadores}</span></summary><div class="grupos">${blocos.join("")}</div></details>` : ""}
    </section>`;
  }

  function render(d) {
    aplicarMarca(d.marca, d.cliente.nome);
    document.title = `${d.cliente.nome} · Relatório semanal`;
    const primeiroNome = d.cliente.nome.split(" ")[0];

    const notas = [];
    if (d.demo) notas.push("os números vêm de Reports de teste no ClickUp");
    if (d.textos_exemplo) notas.push("os textos de resumo são exemplos");
    if (d.marca?.provisoria) notas.push("as cores da marca são provisórias");
    const aviso = notas.length ? `<div class="demo" role="note"><strong>Protótipo com dados de demonstração:</strong> ${esc(notas.join(", ").replace(/, ([^,]*)$/, " e $1"))}.</div>` : "";

    document.getElementById("topo").innerHTML = `
      ${aviso}
      <section class="hero">
        <div class="eyebrow">Relatório semanal · ${esc(d.periodo.rotulo)}</div>
        <h1>Olá, <em>${esc(primeiroNome)}</em>.</h1>
        <p class="hero-sub">Este é o resumo do que fizemos na sua semana e dos resultados de cada área.</p>
        ${d.destaques ? `<div class="lead"><div class="rotulo-secao">Destaques da semana</div><p>${esc(d.destaques)}</p></div>` : ""}
        ${renderPanorama(d.panorama)}
        <nav class="areas-nav" aria-label="Áreas">
          ${d.areas.map((a) => `<a href="#${esc(a.id)}">${esc(a.titulo)}</a>`).join("")}
          ${d.proximos_passos?.length ? `<a href="#proximos-passos">Próximos passos</a>` : ""}
        </nav>
      </section>

      <section class="comparacao" id="comparacao" ${d.comparacao_anterior ? "" : "hidden"} aria-label="Comparação com a semana anterior"></section>
      <section class="evolucao" id="evolucao" ${(d.historico?.length ?? 0) >= 2 ? "" : "hidden"} aria-label="Evolução semana a semana"></section>

      ${d.areas.map(renderArea).join("")}

      ${d.proximos_passos?.length ? `
      <section class="passos" id="proximos-passos">
        <div class="eyebrow">Para a próxima semana</div>
        <h2>Próximos passos</h2>
        <ul>${d.proximos_passos.map((p) => `<li><span>${esc(p)}</span></li>`).join("")}</ul>
      </section>` : ""}
    `;

    const rodape = document.getElementById("rodape");
    rodape.querySelector(".wrap").innerHTML = `
      <span>Atualizado em <b>${esc(dataLonga(d.fonte.coletado_em))}</b></span>
      <span>Dados dos Reports semanais das líderes de área no ${esc(d.fonte.sistema)} · Relatório preparado por <b>Mantora Lab</b></span>`;
    rodape.hidden = false;
  }

  // ---------- Interações: alternar gráfico/tabela e tooltip ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-alterna]");
    if (!b) return;
    const id = b.dataset.alterna;
    const mostrarTabela = b.getAttribute("aria-expanded") !== "true";
    document.getElementById(`${id}-g`).hidden = mostrarTabela;
    document.getElementById(`${id}-t`).hidden = !mostrarTabela;
    b.setAttribute("aria-expanded", String(mostrarTabela));
    b.textContent = mostrarTabela ? "Ver gráfico" : "Ver tabela";
  });

  const tip = document.getElementById("tip");
  document.addEventListener("pointermove", (e) => {
    const alvo = e.target.closest?.("[data-tip]");
    if (!alvo) { tip.hidden = true; return; }
    const [rotulo, valor] = alvo.dataset.tip.split("|");
    tip.innerHTML = `${esc(rotulo)}<br><b>${esc(valor)}</b>`;
    tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = `${x}px`;
    tip.style.top = `${e.clientY + 16}px`;
  });
  document.addEventListener("pointerleave", () => { tip.hidden = true; });

  // ---------- Dados ----------
  // A página depende só do formato do JSON. Hoje: data/<cliente>.json. Depois: Supabase, mesmo formato.
  const slug = (new URLSearchParams(location.search).get("cliente") || "sabrina").replace(/[^a-z0-9-]/gi, "");
  fetch(`data/${slug}.json`, { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(render)
    .catch((err) => {
      const local = location.protocol === "file:";
      document.getElementById("estado").innerHTML = local
        ? `Abra a página por um servidor local para carregar os dados:<br><br><code>python3 -m http.server 8000</code><br><br>e acesse <code>http://localhost:8000</code>.`
        : `Não foi possível carregar o relatório (${esc(err.message)}).`;
    });
})();
</script>
</body>
</html>
